services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maha_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maha_intel"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/maha_intel
      STORAGE_PATH: /data/storage
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - content_data:/data/storage
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
  content_data:

